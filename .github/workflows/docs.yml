name: Docs

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check and build
        run: pnpm check

  deploy:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Prepare Pages artifact
        run: |
          rm -rf pages-dist
          mkdir -p pages-dist/agentdock
          cp -R build/. pages-dist/agentdock/
          printf '/ /agentdock/ 302\n' > pages-dist/_redirects

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: >-
          npx --yes wrangler@4.145.0 pages deploy pages-dist
          --project-name=agentdock-docs
          --branch=${{ github.head_ref || github.ref_name }}


  deploy-legacy-github-pages:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Prepare legacy redirect site
        run: |
          mkdir -p legacy-pages
          cat > legacy-pages/404.html <<'EOF'
          <!doctype html>
          <html lang="en">
            <head>
              <meta charset="utf-8">
              <meta name="robots" content="noindex">
              <title>AgentDock Docs moved</title>
              <script>
                const legacyBase = '/agentdock-docs';
                const suffix = location.pathname.startsWith(legacyBase)
                  ? location.pathname.slice(legacyBase.length)
                  : location.pathname;
                location.replace(
                  'https://docs.nexusdock.co/agentdock' +
                  (suffix || '/') +
                  location.search +
                  location.hash
                );
              </script>
            </head>
            <body>
              <p>AgentDock documentation has moved to <a href="https://docs.nexusdock.co/agentdock/">docs.nexusdock.co</a>.</p>
            </body>
          </html>
          EOF
          cp legacy-pages/404.html legacy-pages/index.html

      - name: Upload legacy GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: legacy-pages

      - name: Deploy legacy GitHub Pages redirect
        id: deployment
        uses: actions/deploy-pages@v4
